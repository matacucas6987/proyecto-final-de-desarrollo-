services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the root .env file (see .env.example)}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - biblioteca-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biblioteca-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - biblioteca-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  biblioteca-network:
    driver: bridge
